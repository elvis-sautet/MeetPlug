<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetPlug Demo - Test in Browser</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 16px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status {
      margin-top: 20px;
      padding: 12px;
      background: #f0f0f0;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
    }

    .status.success {
      background: #d4edda;
      color: #155724;
    }

    .status.error {
      background: #f8d7da;
      color: #721c24;
    }

    .features {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #e0e0e0;
    }

    .feature {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
      color: #666;
      font-size: 14px;
    }

    .feature-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      color: white;
      font-size: 12px;
    }

    #app {
      min-height: 100vh;
    }

    .meeting-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="container" id="join-form">
      <h1>🎥 MeetPlug Demo</h1>
      <p class="subtitle">Test your WebRTC meeting package</p>

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="Enter your name" value="Demo User">
      </div>

      <div class="form-group">
        <label for="room">Room ID</label>
        <input type="text" id="room" placeholder="Enter room ID" value="demo-room-123">
      </div>

      <button id="join-btn">Join Meeting</button>

      <div class="features">
        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Real-time video and audio</span>
        </div>
        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Screen sharing</span>
        </div>
        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Chat messaging</span>
        </div>
        <div class="feature">
          <div class="feature-icon">✓</div>
          <span>Multiple layouts</span>
        </div>
      </div>

      <div id="status" class="status" style="display: none;"></div>
    </div>
  </div>

  <script type="module">
    import { MeetPlugSDK } from './dist/index.esm.js';

    let sdk = null;

    const nameInput = document.getElementById('name');
    const roomInput = document.getElementById('room');
    const joinBtn = document.getElementById('join-btn');
    const statusDiv = document.getElementById('status');
    const joinForm = document.getElementById('join-form');

    function showStatus(message, type = 'info') {
      statusDiv.style.display = 'block';
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
    }

    joinBtn.addEventListener('click', async () => {
      const name = nameInput.value.trim();
      const room = roomInput.value.trim();

      if (!name || !room) {
        showStatus('Please enter both name and room ID', 'error');
        return;
      }

      try {
        joinBtn.disabled = true;
        showStatus('Initializing MeetPlug SDK...', 'info');

        // Initialize SDK
        sdk = new MeetPlugSDK({
          enableChat: true,
          enableScreenShare: true,
        });

        showStatus('Requesting camera and microphone access...', 'info');

        // Set up event listeners
        sdk.on('room:joined', (roomData) => {
          console.log('✅ Joined room:', roomData);
          showStatus(`Successfully joined room: ${roomData.id}`, 'success');

          // Create meeting UI
          setTimeout(() => {
            createMeetingUI();
          }, 1000);
        });

        sdk.on('room:error', (error) => {
          console.error('❌ Room error:', error);
          showStatus(`Error: ${error.message}`, 'error');
          joinBtn.disabled = false;
        });

        sdk.on('participant:joined', (participant) => {
          console.log('👤 Participant joined:', participant);
          showStatus(`${participant.name} joined the meeting`, 'success');
        });

        sdk.on('participant:left', (participantId) => {
          console.log('👋 Participant left:', participantId);
        });

        // Join room
        await sdk.joinRoom(room, name);

      } catch (error) {
        console.error('Failed to join:', error);
        showStatus(`Failed to join: ${error.message}`, 'error');
        joinBtn.disabled = false;
      }
    });

    function createMeetingUI() {
      joinForm.style.display = 'none';

      const meetingContainer = document.createElement('div');
      meetingContainer.className = 'meeting-container';
      meetingContainer.innerHTML = `
        <div style="width: 100%; height: 100%; background: #1a1a2e; display: flex; flex-direction: column;">
          <!-- Header -->
          <div style="padding: 20px; background: #16213e; border-bottom: 1px solid #0f3460;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <h2 style="color: white; margin: 0;">MeetPlug Demo</h2>
                <p style="color: #888; margin: 5px 0 0 0; font-size: 14px;">Room: ${roomInput.value}</p>
              </div>
              <button id="leave-btn" style="padding: 10px 20px; background: #e94560; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600;">
                Leave Meeting
              </button>
            </div>
          </div>

          <!-- Video Area -->
          <div style="flex: 1; padding: 20px; display: flex; align-items: center; justify-content: center;">
            <div style="text-align: center;">
              <div style="width: 200px; height: 200px; margin: 0 auto 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                <span style="font-size: 80px; color: white;">${nameInput.value.charAt(0).toUpperCase()}</span>
              </div>
              <h3 style="color: white; margin-bottom: 10px;">${nameInput.value}</h3>
              <p style="color: #888;">Camera: <span style="color: #4caf50;">ON</span> | Mic: <span style="color: #4caf50;">ON</span></p>
              <div id="local-video-container" style="margin-top: 20px;"></div>
            </div>
          </div>

          <!-- Controls -->
          <div style="padding: 20px; background: #16213e; border-top: 1px solid #0f3460;">
            <div style="display: flex; gap: 15px; justify-content: center;">
              <button id="toggle-audio" style="width: 60px; height: 60px; border-radius: 50%; background: #4caf50; border: none; cursor: pointer; transition: all 0.3s;">
                <span style="font-size: 24px;">🎤</span>
              </button>
              <button id="toggle-video" style="width: 60px; height: 60px; border-radius: 50%; background: #4caf50; border: none; cursor: pointer; transition: all 0.3s;">
                <span style="font-size: 24px;">📹</span>
              </button>
              <button id="toggle-screen" style="width: 60px; height: 60px; border-radius: 50%; background: #2196f3; border: none; cursor: pointer; transition: all 0.3s;">
                <span style="font-size: 24px;">🖥️</span>
              </button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('app').appendChild(meetingContainer);

      // Add local video
      const localStream = sdk.getLocalStream();
      if (localStream) {
        const videoContainer = document.getElementById('local-video-container');
        const video = document.createElement('video');
        video.srcObject = localStream;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;
        video.style.width = '320px';
        video.style.borderRadius = '10px';
        video.style.border = '2px solid #667eea';
        videoContainer.appendChild(video);
      }

      // Controls
      let audioEnabled = true;
      let videoEnabled = true;

      document.getElementById('toggle-audio').addEventListener('click', async function() {
        await sdk.toggleAudio();
        audioEnabled = !audioEnabled;
        this.style.background = audioEnabled ? '#4caf50' : '#f44336';
        this.querySelector('span').textContent = audioEnabled ? '🎤' : '🔇';
      });

      document.getElementById('toggle-video').addEventListener('click', async function() {
        await sdk.toggleVideo();
        videoEnabled = !videoEnabled;
        this.style.background = videoEnabled ? '#4caf50' : '#f44336';
        this.querySelector('span').textContent = videoEnabled ? '📹' : '📵';
      });

      document.getElementById('toggle-screen').addEventListener('click', async function() {
        try {
          await sdk.toggleScreenShare();
        } catch (error) {
          alert('Screen sharing failed: ' + error.message);
        }
      });

      document.getElementById('leave-btn').addEventListener('click', () => {
        if (sdk) {
          sdk.leaveRoom();
          sdk.destroy();
        }
        location.reload();
      });
    }
  </script>
</body>
</html>
