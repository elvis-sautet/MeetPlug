<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeetPlug - Complete Demo with Optional Media</title>
  <link rel="stylesheet" href="./dist/style.css">
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #app {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { MeetPlugSDK } from './dist/index.esm.js';

    let sdk = null;
    let currentRoom = null;

    // Pre-join UI
    function showPreJoinUI() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="mp-flex mp-items-center mp-justify-center mp-min-h-screen mp-bg-background mp-p-4">
          <div class="mp-w-full mp-max-w-2xl mp-bg-card mp-border mp-border-border mp-rounded-lg mp-shadow-lg">
            <div class="mp-p-6 mp-border-b mp-border-border">
              <h2 class="mp-text-2xl mp-font-bold">Join Meeting</h2>
              <p class="mp-text-muted-foreground mp-mt-1">Set up your audio and video before joining</p>
            </div>

            <div class="mp-p-6 mp-space-y-6">
              <!-- Video Preview -->
              <div class="mp-relative mp-aspect-video mp-bg-muted mp-rounded-lg mp-overflow-hidden">
                <video id="preview-video" autoplay muted playsinline class="mp-w-full mp-h-full mp-object-cover mp-scale-x-[-1]" style="display: none;"></video>
                <div id="preview-avatar" class="mp-absolute mp-inset-0 mp-flex mp-flex-col mp-items-center mp-justify-center mp-bg-gradient-to-br mp-from-primary/20 mp-to-secondary/20">
                  <div class="mp-w-24 mp-h-24 mp-rounded-full mp-bg-primary mp-text-primary-foreground mp-flex mp-items-center mp-justify-center mp-text-4xl mp-font-bold">
                    ?
                  </div>
                  <p class="mp-text-muted-foreground mp-text-sm mp-mt-4">Camera is off</p>
                </div>

                <!-- Status Badges -->
                <div class="mp-absolute mp-top-4 mp-right-4 mp-flex mp-gap-2">
                  <span id="muted-badge" class="mp-px-2 mp-py-1 mp-bg-destructive mp-text-destructive-foreground mp-rounded-md mp-text-xs mp-font-semibold" style="display: none;">
                    Muted
                  </span>
                  <span id="camera-off-badge" class="mp-px-2 mp-py-1 mp-bg-destructive mp-text-destructive-foreground mp-rounded-md mp-text-xs mp-font-semibold" style="display: none;">
                    Camera Off
                  </span>
                </div>
              </div>

              <!-- Name Input -->
              <div class="mp-space-y-2">
                <label for="name" class="mp-text-sm mp-font-medium">Your Name</label>
                <input
                  id="name"
                  type="text"
                  placeholder="Enter your name"
                  class="mp-flex mp-h-10 mp-w-full mp-rounded-md mp-border mp-border-input mp-bg-background mp-px-3 mp-py-2 mp-text-sm mp-ring-offset-background placeholder:mp-text-muted-foreground focus-visible:mp-outline-none focus-visible:mp-ring-2 focus-visible:mp-ring-ring"
                  value="Test User"
                />
              </div>

              <!-- Media Controls -->
              <div class="mp-flex mp-items-center mp-justify-center mp-gap-3">
                <button id="toggle-audio" class="mp-rounded-full mp-w-12 mp-h-12 mp-bg-secondary mp-text-secondary-foreground mp-flex mp-items-center mp-justify-center hover:mp-opacity-90">
                  <svg class="mp-w-5 mp-h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
                  </svg>
                </button>

                <button id="toggle-video" class="mp-rounded-full mp-w-12 mp-h-12 mp-bg-secondary mp-text-secondary-foreground mp-flex mp-items-center mp-justify-center hover:mp-opacity-90">
                  <svg class="mp-w-5 mp-h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
                  </svg>
                </button>
              </div>

              <!-- Join Button -->
              <button id="join-btn" class="mp-w-full mp-h-12 mp-bg-primary mp-text-primary-foreground mp-rounded-md mp-font-semibold hover:mp-bg-primary/90">
                Join Meeting
              </button>

              <!-- Info Text -->
              <p id="join-info" class="mp-text-center mp-text-sm mp-text-muted-foreground">
                You will join with audio and video on
              </p>
            </div>
          </div>
        </div>
      `;

      let audioEnabled = true;
      let videoEnabled = true;
      let previewStream = null;

      // Update preview
      async function updatePreview() {
        const videoEl = document.getElementById('preview-video');
        const avatarEl = document.getElementById('preview-avatar');
        const mutedBadge = document.getElementById('muted-badge');
        const cameraBadge = document.getElementById('camera-off-badge');
        const joinInfo = document.getElementById('join-info');

        // Stop existing stream
        if (previewStream) {
          previewStream.getTracks().forEach(track => track.stop());
        }

        try {
          if (audioEnabled || videoEnabled) {
            previewStream = await navigator.mediaDevices.getUserMedia({
              audio: audioEnabled,
              video: videoEnabled
            });

            if (videoEnabled) {
              videoEl.srcObject = previewStream;
              videoEl.style.display = 'block';
              avatarEl.style.display = 'none';
            } else {
              videoEl.style.display = 'none';
              avatarEl.style.display = 'flex';
            }
          } else {
            videoEl.style.display = 'none';
            avatarEl.style.display = 'flex';
          }
        } catch (error) {
          console.error('Error accessing media:', error);
        }

        // Update badges
        mutedBadge.style.display = !audioEnabled ? 'block' : 'none';
        cameraBadge.style.display = !videoEnabled ? 'block' : 'none';

        // Update info text
        if (!audioEnabled && !videoEnabled) {
          joinInfo.textContent = 'You will join with audio and video off';
        } else if (!audioEnabled) {
          joinInfo.textContent = 'You will join with audio off';
        } else if (!videoEnabled) {
          joinInfo.textContent = 'You will join with video off';
        } else {
          joinInfo.textContent = 'You will join with audio and video on';
        }
      }

      // Toggle audio
      document.getElementById('toggle-audio').addEventListener('click', async function() {
        audioEnabled = !audioEnabled;
        this.className = audioEnabled
          ? 'mp-rounded-full mp-w-12 mp-h-12 mp-bg-secondary mp-text-secondary-foreground mp-flex mp-items-center mp-justify-center hover:mp-opacity-90'
          : 'mp-rounded-full mp-w-12 mp-h-12 mp-bg-destructive mp-text-destructive-foreground mp-flex mp-items-center mp-justify-center hover:mp-opacity-90';
        await updatePreview();
      });

      // Toggle video
      document.getElementById('toggle-video').addEventListener('click', async function() {
        videoEnabled = !videoEnabled;
        this.className = videoEnabled
          ? 'mp-rounded-full mp-w-12 mp-h-12 mp-bg-secondary mp-text-secondary-foreground mp-flex mp-items-center mp-justify-center hover:mp-opacity-90'
          : 'mp-rounded-full mp-w-12 mp-h-12 mp-bg-destructive mp-text-destructive-foreground mp-flex mp-items-center mp-justify-center hover:mp-opacity-90';
        await updatePreview();
      });

      // Join button
      document.getElementById('join-btn').addEventListener('click', async () => {
        const name = document.getElementById('name').value;
        if (!name.trim()) {
          alert('Please enter your name');
          return;
        }

        // Stop preview stream
        if (previewStream) {
          previewStream.getTracks().forEach(track => track.stop());
        }

        // Join meeting
        await joinMeeting(name, audioEnabled, videoEnabled);
      });

      // Initialize preview
      updatePreview();
    }

    // Join meeting
    async function joinMeeting(name, audio, video) {
      try {
        document.getElementById('app').innerHTML = '<div class="mp-flex mp-items-center mp-justify-center mp-min-h-screen"><p class="mp-text-lg">Joining meeting...</p></div>';

        sdk = new MeetPlugSDK({
          enableChat: true,
          enableScreenShare: true,
          enableReactions: true,
          enableRaiseHand: true,
        });

        sdk.on('room:joined', (room) => {
          currentRoom = room;
          console.log('✅ Joined room:', room);
          showMeetingUI();
        });

        sdk.on('participant:joined', (participant) => {
          console.log('👤 Participant joined:', participant);
        });

        await sdk.joinRoom('demo-room', name, { audio, video });
      } catch (error) {
        console.error('Failed to join:', error);
        alert('Failed to join meeting: ' + error.message);
        showPreJoinUI();
      }
    }

    // Meeting UI
    function showMeetingUI() {
      const app = document.getElementById('app');
      app.innerHTML = `
        <div class="mp-flex mp-flex-col mp-h-screen mp-bg-background">
          <!-- Header -->
          <div class="mp-px-6 mp-py-4 mp-bg-card mp-border-b mp-border-border mp-flex mp-items-center mp-justify-between">
            <div class="mp-flex mp-items-center mp-gap-4">
              <h1 class="mp-text-xl mp-font-bold">MeetPlug Demo</h1>
              <span class="mp-px-2 mp-py-1 mp-bg-green-500 mp-text-white mp-text-xs mp-rounded-full mp-font-semibold mp-flex mp-items-center mp-gap-1">
                <span class="mp-w-2 mp-h-2 mp-bg-white mp-rounded-full mp-animate-pulse"></span>
                Live
              </span>
            </div>
            <button onclick="leaveMeeting()" class="mp-px-4 mp-py-2 mp-bg-destructive mp-text-destructive-foreground mp-rounded-md mp-font-semibold hover:mp-opacity-90">
              Leave
            </button>
          </div>

          <!-- Video Area -->
          <div class="mp-flex-1 mp-p-4 mp-flex mp-items-center mp-justify-center">
            <div class="mp-text-center">
              <div class="mp-w-64 mp-h-64 mp-mx-auto mp-bg-gradient-to-br mp-from-primary/20 mp-to-secondary/20 mp-rounded-lg mp-flex mp-items-center mp-justify-center">
                <div class="mp-w-32 mp-h-32 mp-rounded-full mp-bg-primary mp-text-primary-foreground mp-flex mp-items-center mp-justify-center mp-text-5xl mp-font-bold">
                  ${sdk.getLocalParticipant()?.name?.charAt(0).toUpperCase() || '?'}
                </div>
              </div>
              <p class="mp-mt-4 mp-text-lg mp-font-semibold">${sdk.getLocalParticipant()?.name || 'Guest'}</p>
              <p class="mp-text-sm mp-text-muted-foreground mp-mt-1">
                Audio: ${sdk.getLocalParticipant()?.audioEnabled ? 'ON' : 'OFF'} |
                Video: ${sdk.getLocalParticipant()?.videoEnabled ? 'ON' : 'OFF'}
              </p>
              <div class="mp-mt-6 mp-p-4 mp-bg-muted mp-rounded-lg mp-text-sm mp-text-left">
                <p class="mp-font-semibold mp-mb-2">✅ Features Working:</p>
                <ul class="mp-space-y-1">
                  <li>✓ Optional media (join without video/audio)</li>
                  <li>✓ Pre-join screen with preview</li>
                  <li>✓ Reactions support</li>
                  <li>✓ Raise hand feature</li>
                  <li>✓ Host controls</li>
                  <li>✓ Minimalistic UI</li>
                </ul>
              </div>
            </div>
          </div>

          <!-- Controls (simplified for demo) -->
          <div class="mp-px-6 mp-py-4 mp-bg-card mp-border-t mp-border-border mp-flex mp-items-center mp-justify-center mp-gap-3">
            <button class="mp-px-6 mp-py-2 mp-bg-secondary mp-text-secondary-foreground mp-rounded-full mp-font-semibold">
              Controls
            </button>
            <button onclick="leaveMeeting()" class="mp-px-6 mp-py-2 mp-bg-destructive mp-text-destructive-foreground mp-rounded-full mp-font-semibold">
              Leave
            </button>
          </div>
        </div>
      `;
    }

    // Leave meeting
    window.leaveMeeting = function() {
      if (sdk) {
        sdk.leaveRoom();
        sdk.destroy();
        sdk = null;
      }
      showPreJoinUI();
    };

    // Start with pre-join UI
    showPreJoinUI();
  </script>
</body>
</html>
